name: Continuous Integration Build

# yamllint disable-line rule:truthy
on:
  push:
    branches:
      - main

  workflow_dispatch: ~

jobs:
  lint-repository-files:
    name: Lint all files
    uses: syskom/ci-cd/.github/workflows/reusable-lint-files.yaml@d04a8410ad3b1acb259abb29316e1c2a0499d2ec # main
    permissions:
      checks: write
      contents: read
    with:
      lint-editorconfig: true
      lint-github-actions: true
      lint-github-workflows: true
      lint-renovate-config: true
      lint-yaml-files: true
